
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bz-tag"
version = "0.1.0"
description = "A terminal-based MP3 tag editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "urwid",
    "mutagen",
    "pillow",
    "term-image",
]

[project.scripts]
bztag = "bztag.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/bztag"]
